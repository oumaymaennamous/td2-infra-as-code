---
# Preparation du systeme avant installation de K3s.
# Toutes les taches sont idempotentes.

- name: Desactiver systemd-resolved (reverrouille /etc/resolv.conf)
  ansible.builtin.systemd:
    name: systemd-resolved
    state: stopped
    enabled: false
  become: true
  failed_when: false

- name: Ecrire un /etc/resolv.conf statique
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      nameserver 1.1.1.1
      nameserver 8.8.8.8
    mode: '0644'
  become: true

- name: Ajouter l'entree locale dans /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "127.0.1.1 {{ inventory_hostname }}"
    state: present
  become: true

- name: Mettre a jour le cache apt
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true
