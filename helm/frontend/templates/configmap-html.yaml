apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-html
data:
  index.html: |
    <!doctype html>
    <html lang="fr">
    <head>
      <meta charset="utf-8">
      <title>NovaShop - TD2</title>
      <style>
        * { box-sizing: border-box; }
        body {
          font-family: sans-serif;
          margin: 0;
          padding: 2em;
          background: #f0f4f8;
          color: #1f2937;
        }
        .container { max-width: 900px; margin: 0 auto; }
        header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 2em;
        }
        h1 { color: #1950a0; margin: 0; font-size: 2em; }
        .tagline { color: #6b7280; font-size: 0.9em; margin-top: 0.2em; }
        .cards {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
          gap: 1em;
          margin-bottom: 2em;
        }
        .card {
          background: #fff;
          padding: 1em 1.2em;
          border-radius: 8px;
          border-left: 4px solid #1950a0;
        }
        .card.backend { border-left-color: #e6781e; }
        .card.db { border-left-color: #059669; }
        .card-label { color: #6b7280; font-size: 0.85em; margin-bottom: 0.5em; }
        .card-value { font-weight: 600; overflow-wrap: anywhere; }
        table {
          width: 100%;
          background: #fff;
          border-radius: 8px;
          border-collapse: collapse;
        }
        thead { background: #1950a0; color: #fff; }
        th { text-align: left; padding: 0.8em 1em; }
        td { padding: 0.7em 1em; border-bottom: 1px solid #e5e7eb; }
        .status {
          display: inline-block;
          padding: 0.2em 0.6em;
          border-radius: 999px;
          background: #d1fae5;
          color: #065f46;
          font-size: 0.8em;
          font-weight: 600;
        }
        .refresh-note {
          text-align: center;
          color: #9ca3af;
          font-size: 0.85em;
          margin-top: 2em;
        }
        .error {
          background: #fee2e2;
          color: #991b1b;
          padding: 1em;
        }
      </style>
    </head>
    <body>
      <div class="container">
        <header>
          <div>
            <h1>NovaShop</h1>
            <div class="tagline">Application 3-tiers — TD2 IaC / DevSecOps</div>
          </div>
          <span class="status" id="status">● En ligne</span>
        </header>

        <div class="cards">
          <div class="card">
            <div class="card-label">Pod frontend</div>
            <div class="card-value" id="frontend-pod">—</div>
          </div>
          <div class="card backend">
            <div class="card-label">Pod backend</div>
            <div class="card-value" id="backend-pod">—</div>
          </div>
          <div class="card db">
            <div class="card-label">Base de données</div>
            <div class="card-value">PostgreSQL 16</div>
          </div>
        </div>

        <table>
          <thead><tr><th>ID</th><th>Nom de l’article</th></tr></thead>
          <tbody id="items-body">
            <tr><td colspan="2">Chargement...</td></tr>
          </tbody>
        </table>

        <div class="refresh-note">Rafraîchissement automatique toutes les 5 secondes</div>
      </div>

      <script>
        async function refresh() {
          try {
            const headResp = await fetch('/?cachebust=' + Date.now(), { method: 'HEAD' });
            const fpod = headResp.headers.get('X-Pod-Name') || '?';
            document.getElementById('frontend-pod').textContent = fpod;

            const apiResp = await fetch('/api/items?cachebust=' + Date.now());
            const data = await apiResp.json();
            document.getElementById('backend-pod').textContent = data.pod || '?';

            const tbody = document.getElementById('items-body');
            tbody.innerHTML = '';

            if (!data.items || data.items.length === 0) {
              tbody.innerHTML = '<tr><td colspan="2">Aucun article</td></tr>';
            } else {
              for (const it of data.items) {
                const tr = document.createElement('tr');
                const id = document.createElement('td');
                const name = document.createElement('td');
                id.textContent = it.id;
                name.textContent = it.name;
                tr.appendChild(id);
                tr.appendChild(name);
                tbody.appendChild(tr);
              }
            }

            const status = document.getElementById('status');
            status.textContent = '● En ligne';
            status.style.background = '#d1fae5';
            status.style.color = '#065f46';
          } catch (e) {
            const status = document.getElementById('status');
            status.textContent = '● Hors ligne';
            status.style.background = '#fee2e2';
            status.style.color = '#991b1b';
            document.getElementById('items-body').innerHTML =
              '<tr><td colspan="2" class="error">Erreur de connexion</td></tr>';
          }
        }

        refresh();
        setInterval(refresh, 5000);
      </script>
    </body>
    </html>
